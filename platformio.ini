; ============================================================================
; DMK SMART 1.1 - SERVE (bomba) e CONTROLE (botoes) no mesmo projeto
; Mais facil: execute DMK.bat (menu). Ele instala tudo, compila e grava.
;
;   Placa              SERVE             CONTROLE
;   ESP32 (4 MB)       SERVE_ESP32       CONTROLE_ESP32
;   ESP32-S3 (8 MB)    SERVE_ESP32S3     CONTROLE_ESP32S3
;   ESP8266 (4 MB)     SERVE_ESP8266     CONTROLE_ESP8266
;
; O painel web vai embutido no firmware: NAO precisa mais de "uploadfs".
; ============================================================================

[platformio]
default_envs = SERVE_ESP32, CONTROLE_ESP32

[env]
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.filesystem = littlefs
extra_scripts =
  pre:scripts/pio_pre.py
  post:scripts/pio_post.py
lib_deps =
  knolleary/PubSubClient@2.8
  bblanchon/ArduinoJson@7.4.3

[esp32_base]
platform = espressif32@7.1.3
monitor_filters = esp32_exception_decoder

[esp32s3_base]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
monitor_filters = esp32_exception_decoder

[esp8266_base]
platform = espressif8266@4.2.1
board = esp12e
board_build.ldscript = eagle.flash.4m2m.ld
monitor_filters = esp8266_exception_decoder

; ----------------------------------------------------------------- SERVE ---
[env:SERVE_ESP32]
extends = esp32_base
board = esp32dev
board_build.partitions = partitions/dmk_esp32_4mb_ota_grande.csv
build_src_filter = -<*> +<common/> +<serve/>
build_flags = -D DMK_BOARD_ESP32 -D DMK_ROLE_SERVE -D DMK_OTA_TARGET=\"SERVE_ESP32\" -I include/serve

[env:SERVE_ESP32S3]
extends = esp32s3_base
build_src_filter = -<*> +<common/> +<serve/>
build_flags = -D DMK_BOARD_ESP32S3 -D DMK_ROLE_SERVE -D DMK_OTA_TARGET=\"SERVE_ESP32S3\" -I include/serve

[env:SERVE_ESP8266]
extends = esp8266_base
build_src_filter = -<*> +<common/> +<serve/>
build_flags = -D DMK_BOARD_ESP8266 -D DMK_ROLE_SERVE -D DMK_OTA_TARGET=\"SERVE_ESP8266\" -I include/serve

; -------------------------------------------------------------- CONTROLE ---
[env:CONTROLE_ESP32]
extends = esp32_base
board = esp32dev
board_build.partitions = partitions/dmk_esp32_4mb_ota_grande.csv
build_src_filter = -<*> +<common/> +<controle/>
build_flags = -D DMK_BOARD_ESP32 -D DMK_ROLE_CONTROLE -D DMK_OTA_TARGET=\"CONTROLE_ESP32\" -I include/controle

[env:CONTROLE_ESP32S3]
extends = esp32s3_base
build_src_filter = -<*> +<common/> +<controle/>
build_flags = -D DMK_BOARD_ESP32S3 -D DMK_ROLE_CONTROLE -D DMK_OTA_TARGET=\"CONTROLE_ESP32S3\" -I include/controle

[env:CONTROLE_ESP8266]
extends = esp8266_base
build_src_filter = -<*> +<common/> +<controle/>
build_flags = -D DMK_BOARD_ESP8266 -D DMK_ROLE_CONTROLE -D DMK_OTA_TARGET=\"CONTROLE_ESP8266\" -I include/controle
